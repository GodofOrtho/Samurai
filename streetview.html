html,body{height:100%;margin:0;background:#000;font-family:system-ui,sans-serif;overflow:hidden}

@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
.walk #body{animation:bob .45s ease-in-out infinite}
.walk #legL,.walk #armR{animation:sw .9s linear infinite}
.walk #legR,.walk #armL{animation:sw .9s linear infinite;animation-delay:-.45s}
@keyframes arm{0%{transform:rotate(0)}30%{transform:rotate(-160deg)}45%{transform:rotate(-160deg)}70%{transform:rotate(-8deg)}100%{transform:rotate(0)}}

.slash #armR{animation:arm .9s ease-in-out 1 !important}
.slash #blade{animation:bl .9s ease-in-out 1}

<script>
const $ = id => document.getElementById(id);
const hud = t => $('hud').textContent = t;
const showErr = t => { const e = $('err'); e.textContent = t; e.style.display = 'block'; };
let KEY = '';
try { KEY = localStorage.getItem('gkey') || ''; } catch (e) {}
if (!KEY) { KEY = (prompt('Cola aqui a tua chave Google (fica só neste dispositivo):') || '').trim(); if (KEY) { try { localStorage.setItem('gkey', KEY); } catch (e) {} } }
try { const f = localStorage.getItem('samuraiFace'); if (f) $('face').setAttribute('href', f); } catch (e) {}
window.addEventListener('error', e => showErr('Erro na página: ' + e.message));

const NAMES = ['Hotel Wanokaede', 'Estação Shinjuku-sanchome', 'Golden Gai', 'Kabukichō (Godzilla)'];
const TXT = ['Ponto de partida.', 'Linhas Marunouchi, Fukutoshin e Toei Shinjuku.', 'Centenas de barzinhos minúsculos. Vê o couvert à porta.', 'Néons e clubes de hostess. Ignora angariadores.'];
const ADDR = [
  '6 Chome-12-9 Shinjuku, Shinjuku City, Tokyo 160-0022, Japan',
  'Shinjuku-sanchome Station, Tokyo, Japan',
  'Shinjuku Golden Gai, Tokyo, Japan',
  'Godzilla Head, Shinjuku Toho Building, Kabukicho, Tokyo, Japan'
];
const STEP_M = 12;               // distância entre imagens (metros)
const D2R = Math.PI / 180, EARTH = 6371000;
let P = [], stops = [], info = [], i = 0, playing = false, speed = 1, follow = true, hold = 0, timer, baseH = 0, yaw = 0, token = 0, okOnce = false, loaded = 0;

const dist = (a, b) => Math.hypot((b.lat - a.lat) * D2R, (b.lon - a.lon) * D2R * Math.cos(a.lat * D2R)) * EARTH;
const bear = (a, b) => {
  const y = Math.sin((b.lon - a.lon) * D2R) * Math.cos(b.lat * D2R);
  const x = Math.cos(a.lat * D2R) * Math.sin(b.lat * D2R) - Math.sin(a.lat * D2R) * Math.cos(b.lat * D2R) * Math.cos((b.lon - a.lon) * D2R);
  return (Math.atan2(y, x) / D2R + 360) % 360;
};
function decodePoly(str) {
  let k = 0, lat = 0, lon = 0; const out = [];
  while (k < str.length) {
    let b, sh = 0, r = 0;
    do { b = str.charCodeAt(k++) - 63; r |= (b & 31) << sh; sh += 5; } while (b >= 32);
    lat += (r & 1) ? ~(r >> 1) : (r >> 1);
    sh = 0; r = 0;
    do { b = str.charCodeAt(k++) - 63; r |= (b & 31) << sh; sh += 5; } while (b >= 32);
    lon += (r & 1) ? ~(r >> 1) : (r >> 1);
    out.push({lat: lat / 1e5, lon: lon / 1e5});
  }
  return out;
}
function resample(line) {
  const out = [];
  for (let a = 0; a < line.length - 1; a++) {
    const d = dist(line[a], line[a + 1]), n = Math.max(1, Math.round(d / STEP_M));
    for (let k = 0; k < n; k++) out.push({lat: line[a].lat + (line[a + 1].lat - line[a].lat) * k / n, lon: line[a].lon + (line[a + 1].lon - line[a].lon) * k / n});
  }
  out.push(line[line.length - 1]);
  return out;
}
async function loadRoute() {
  try {
    hud('A calcular o caminho a pé…');
    P = []; stops = [0]; info = [''];
    for (let s = 0; s < ADDR.length - 1; s++) {
      const r = await fetch('https://routes.googleapis.com/directions/v2:computeRoutes', {
        method: 'POST',
        headers: {'Content-Type': 'application/json', 'X-Goog-Api-Key': KEY, 'X-Goog-FieldMask': 'routes.polyline.encodedPolyline,routes.distanceMeters,routes.duration'},
        body: JSON.stringify({origin: {address: ADDR[s]}, destination: {address: ADDR[s + 1]}, travelMode: 'WALK', languageCode: 'pt-PT'})
      });
      const j = await r.json();
      if (!j.routes || !j.routes.length) throw new Error((j.error && j.error.message) || 'sem resultado');
      const rt = j.routes[0], pts = resample(decodePoly(rt.polyline.encodedPolyline));
      P.push(...(s === 0 ? pts : pts.slice(1)));
      stops.push(P.length - 1);
      info.push(' (' + rt.distanceMeters + ' m, cerca de ' + Math.round(parseInt(rt.duration) / 60) + ' min a pé)');
    }
    show(0);
    hud('Pronto: ' + P.length + ' imagens ao longo do caminho. Carrega em ▶ Andar.');
  } catch (e) {
    showErr('Não consegui o caminho: ativa a Routes API e permite-a na chave. (' + e.message + ')');
  }
}
// Pede a fotografia do Street View como imagem normal (Street View Static API)
function load() {
  if (!P.length) return;
  const p = P[i], h = (baseH + yaw + 360) % 360, my = ++token;
  const url = 'https://maps.googleapis.com/maps/api/streetview?size=640x640&location=' + p.lat.toFixed(6) + ',' + p.lon.toFixed(6) +
    '&heading=' + h.toFixed(0) + '&pitch=5&fov=100&radius=50&source=outdoor&return_error_code=true&key=' + encodeURIComponent(KEY);
  const im = new Image();
  im.onload = () => { if (my !== token) return; $('view').src = url; okOnce = true; loaded++; $('err').style.display = 'none'; $('dbg').textContent = p.lat.toFixed(5) + ', ' + p.lon.toFixed(5) + ' · direção ' + h.toFixed(0) + '° · imagens: ' + loaded; };
  im.onerror = () => { if (my !== token) return; if (!okOnce) showErr('A imagem do Street View não carregou. Ativa a "Street View Static API" em APIs e serviços > Biblioteca, junta-a às Restrições da API da chave e confirma o referenciador https://godofortho.github.io/*.'); else $('dbg').textContent = 'sem imagem neste ponto, a saltar…'; };
  im.src = url;
}
function show(k) {
  if (!P.length) return;
  i = Math.max(0, Math.min(P.length - 1, k));
  const nx = P[Math.min(P.length - 1, i + 2)];
  if (follow && nx && dist(P[i], nx) > 0.5) baseH = bear(P[i], nx);
  load();
}
function tick() {
  const walking = playing && Date.now() >= hold;
  $('sam').classList.toggle('walk', walking);
  if (!walking || !P.length) return;
  if (i >= P.length - 1) { playing = false; setPlay(); $('sam').classList.remove('walk'); hud('Chegaste ao destino!'); return; }
  show(i + 1);
  const k = stops.indexOf(i);
  if (k > 0) { hud(NAMES[k] + ': ' + TXT[k] + info[k]); hold = Date.now() + 3500; }
}
function restartTimer() { clearInterval(timer); timer = setInterval(tick, 1400 / speed); }
let playBtn;
function setPlay() { playBtn.textContent = playing ? '⏸ Parar' : '▶ Andar'; }

// Olhar à volta com o dedo
let dragX = null, dragT;
const wrap = $('wrap');
wrap.addEventListener('pointerdown', e => { dragX = e.clientX; });
wrap.addEventListener('pointermove', e => {
  if (dragX === null) return;
  yaw = (yaw - (e.clientX - dragX) * 0.25 + 360) % 360; dragX = e.clientX;
  clearTimeout(dragT); dragT = setTimeout(load, 120);
});
['pointerup', 'pointercancel', 'pointerleave'].forEach(ev => wrap.addEventListener(ev, () => { dragX = null; }));

const ui = $('ui');
const mk = (t, fn) => { const b = document.createElement('button'); b.textContent = t; b.onclick = () => fn(b); ui.appendChild(b); return b; };
playBtn = mk('▶ Andar', () => { if (!P.length) { loadRoute(); return; } if (i >= P.length - 1) show(0); playing = !playing; hold = 0; setPlay(); });
mk('⏮ Início', () => { show(0); hud(NAMES[0] + ': ' + TXT[0]); });
NAMES.forEach((n, k) => mk(n.replace('Estação ', ''), () => { if (!P.length) return; show(stops[k]); hold = Date.now() + 2500; hud(n + ': ' + TXT[k] + info[k]); }));
mk('⏩ Velocidade', b => { speed = speed === 1 ? 2 : speed === 2 ? 3 : 1; b.textContent = '⏩ x' + speed; restartTimer(); });
mk('👁 Olhar livre', b => { follow = !follow; b.classList.toggle('on', !follow); if (follow) { yaw = 0; load(); } });
mk('⚔️ Golpe', () => { const s = $('sam'); s.classList.remove('slash'); void s.getBoundingClientRect(); s.classList.add('slash'); setTimeout(() => s.classList.remove('slash'), 950); });
const fileIn = document.createElement('input'); fileIn.type = 'file'; fileIn.accept = 'image/*'; fileIn.style.display = 'none'; document.body.appendChild(fileIn);
fileIn.onchange = () => {
  const f = fileIn.files[0]; if (!f) return;
  const img = new Image();
  img.onload = () => {
    const sz = 256, cv = document.createElement('canvas'); cv.width = cv.height = sz;
    const q = cv.getContext('2d'), m = Math.min(img.width, img.height);
    q.drawImage(img, (img.width - m) / 2, (img.height - m) / 2, m, m, 0, 0, sz, sz);
    const url = cv.toDataURL('image/png'); $('face').setAttribute('href', url);
    try { localStorage.setItem('samuraiFace', url); } catch (e) {}
    URL.revokeObjectURL(img.src);
  };
  img.src = URL.createObjectURL(f);
};
mk('📷 Foto', () => fileIn.click());
mk('🔑 Chave', () => { try { localStorage.removeItem('gkey'); } catch (e) {} location.reload(); });
restartTimer();
loadRoute();
</script>
</body></html>
